        <!-- Logo -->
        <a href="/admin-dashboard" class="admin-logo">
            SmartCart
            <span>Admin</span>
        </a>

        <!-- Mobile Hamburger Toggle Button (3 lines) -->
        <button class="admin-nav-toggle" id="adminNavToggle" aria-label="Toggle navigation">
            <span class="hamburger-bar"></span>
            <span class="hamburger-bar"></span>
            <span class="hamburger-bar"></span>
        </button>

        <!-- Navigation Links -->
        <div class="admin-nav-links" id="adminNavLinks">

            <a href="/admin-dashboard">
                Dashboard
            </a>

            <a href="/admin/add-item">
                Add Product
            </a>

            <a href="/admin/item-list">
                Products
            </a>

            <a href="/admin/profile">
                Profile
            </a>

            <a href="/admin-logout" class="admin-logout">
                Logout
            </a>

        </div>

    </div>

</nav>

<style>
    .admin-navbar {
        width: 100%;
        background: #ffffff;
        border-bottom: 1px solid #e5e7eb;
        position: sticky;
        top: 0;
        z-index: 1000;
    }

    .admin-nav-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 24px;
        min-height: 68px;

        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 30px;
        position: relative;
    }

    /* Logo */
    .admin-logo {
        text-decoration: none;
        color: #2563eb;
        font-size: 22px;
        font-weight: 700;
        white-space: nowrap;
    }

    .admin-logo span {
        margin-left: 6px;
        padding: 4px 8px;
        border-radius: 5px;
        background: #eff6ff;
        color: #2563eb;
        font-size: 11px;
        font-weight: 600;
        vertical-align: middle;
    }

    /* Navigation Links */
    .admin-nav-links {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .admin-nav-links a {
        text-decoration: none;
        color: #374151;
        font-size: 14px;
        font-weight: 500;
        padding: 9px 12px;
        border-radius: 6px;
        transition: 0.2s ease;
    }

    .admin-nav-links a:hover {
        color: #2563eb;
        background: #eff6ff;
    }

    /* Logout */
    .admin-nav-links .admin-logout {
        color: #dc2626;
    }

    .admin-nav-links .admin-logout:hover {
        color: #b91c1c;
        background: #fef2f2;
    }

    /* Hamburger Toggle Button (3 lines) */
    .admin-nav-toggle {
        display: none;
        flex-direction: column;
        justify-content: space-between;
        width: 28px;
        height: 20px;
        background: transparent;
        border: none;
        cursor: pointer;
        padding: 0;
        z-index: 1001;
    }

    .admin-nav-toggle .hamburger-bar {
        width: 100%;
        height: 3px;
        background-color: #374151;
        border-radius: 3px;
        transition: all 0.3s ease;
    }

    /* Mobile */
    @media (max-width: 768px) {
        .admin-nav-toggle {
            display: flex;
        }

        .admin-nav-links {
            display: none;
            flex-direction: column;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #ffffff;
            padding: 16px;
            border-bottom: 1px solid #e5e7eb;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            gap: 8px;
            width: auto;
        }

        .admin-nav-links.active {
            display: flex;
        }

        .admin-nav-links a {
            text-align: left;
            font-size: 15px;
            padding: 12px 16px;
            width: 100%;
        }

        /* Hamburger to X Animation */
        .admin-nav-toggle.active .hamburger-bar:nth-child(1) {
            transform: translateY(8.5px) rotate(45deg);
        }
        .admin-nav-toggle.active .hamburger-bar:nth-child(2) {
            opacity: 0;
        }
        .admin-nav-toggle.active .hamburger-bar:nth-child(3) {
            transform: translateY(-8.5px) rotate(-45deg);
        }
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const adminNavToggle = document.getElementById('adminNavToggle');
        const adminNavLinks = document.getElementById('adminNavLinks');

        if (adminNavToggle && adminNavLinks) {
            adminNavToggle.addEventListener('click', function(e) {
                e.stopPropagation();
                adminNavToggle.classList.toggle('active');
                adminNavLinks.classList.toggle('active');
            });

            document.addEventListener('click', function(e) {
                if (!adminNavToggle.contains(e.target) && !adminNavLinks.contains(e.target)) {
                    adminNavToggle.classList.remove('active');
                    adminNavLinks.classList.remove('active');
                }
            });
        }
    });
</script>
